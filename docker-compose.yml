services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agrios
      POSTGRES_USER: agrios
      POSTGRES_PASSWORD: agrios
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agrios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrios"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  agrios_data:
